name: Deploy to Dev Server

on:
  push:
    branches: [master]
  workflow_dispatch:

# One deploy at a time. Every push to master starts a run, and all runs install/build in the
# same ~/rizo-app folder — two overlapping runs delete each other's node_modules and .next
# mid-build ("npm warn tar ENOENT", "ENOENT ... _buildManifest.js.tmp"). Queue them instead;
# the later run still deploys the newest commit.
concurrency:
  group: deploy-dev-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/rizo-app
            git pull
            # `npm ci` is supposed to always start from a clean `node_modules`, but a build that
            # got killed mid-install (e.g. the previous run's stuck-build/OOM situation) can leave
            # file locks or partial writes behind that `npm ci` doesn't fully clear, resulting in a
            # `next` install missing files it should have (seen as "Cannot find module .../next/
            # dist/compiled/jest-worker/processChild.js" and other ENOENTs under node_modules/next
            # during build). Removing node_modules outright guarantees every install starts fresh.
            rm -rf node_modules
            npm ci
            # A prior deploy that didn't exit cleanly (e.g. this job getting cancelled or the
            # runner dying mid-build) can leave Next's build lock behind, which then makes every
            # subsequent `next build` refuse to start with "Another next build process is already
            # running" even though nothing is actually running anymore. Clear it defensively before
            # building so a stuck lock can't block deploys indefinitely.
            rm -f .next/lock
            npm run build
            pm2 restart rizo
